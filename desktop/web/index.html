<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Remote - Điều Khiển Điện Thoại Từ Xa</title>
    <style>
        :root {
            --bg-base: #090d16;
            --bg-surface: #111827;
            --bg-elevated: #1e293b;
            --bg-hover: #334155;
            --border-color: #1f293d;
            --border-focus: #3b82f6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-amber: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Sidebar điều khiển bên trái phong cách Hiện Đại / macOS */
        #sidebar {
            width: 340px;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            overflow-y: auto;
            z-index: 20;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4);
        }

        #sidebar::-webkit-scrollbar {
            width: 6px;
        }
        #sidebar::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }

        /* Header thương hiệu */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .brand-text h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .brand-text p {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Badge trạng thái */
        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .status-online { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-offline { background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }
        .status-connecting { background: rgba(245, 158, 11, 0.15); color: #fde047; border: 1px solid rgba(245, 158, 11, 0.3); }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        /* Nhóm chức năng */
        .group-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .group-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }

        .btn-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        button.action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 9px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        button.action-btn:hover {
            background: var(--bg-hover);
            border-color: #475569;
            transform: translateY(-1px);
        }

        button.action-btn:active {
            transform: translateY(0);
        }

        button.btn-primary {
            background: var(--accent-blue);
            border-color: #3b82f6;
        }
        button.btn-primary:hover {
            background: var(--accent-blue-hover);
        }

        button.btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.3);
        }
        button.btn-danger:hover {
            background: #dc2626;
            color: #fff;
            border-color: #ef4444;
        }

        button.btn-warning {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.3);
        }
        button.btn-warning:hover {
            background: #d97706;
            color: #fff;
        }

        /* Hộp kết nối & QR */
        .connect-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .url-badge {
            background: #090d16;
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11px;
            color: #38bdf8;
            word-break: break-all;
            user-select: all;
        }

        .qr-wrapper {
            background: #ffffff;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 4px auto;
        }

        .qr-wrapper img {
            width: 130px;
            height: 130px;
            display: block;
        }

        /* Viewport trung tâm chứa màn hình điện thoại */
        #viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #111827 0%, #090d16 100%);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* Khung viền điện thoại mượt mà tự động xoay */
        .device-container {
            position: relative;
            background: #000;
            padding: 10px;
            border-radius: 40px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 0 3px #334155, 0 0 0 5px #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 90vw;
            max-height: 90vh;
        }

        .device-container.orientation-portrait {
            flex-direction: column;
        }

        .device-container.orientation-landscape {
            flex-direction: row;
        }

        #phone-canvas {
            display: block;
            border-radius: 28px;
            cursor: crosshair;
            background: #000;
            max-height: 82vh;
            max-width: 82vw;
            width: auto;
            height: auto;
            object-fit: contain;
            touch-action: none;
            transition: transform 0.3s ease;
        }

        /* Thanh dock điều khiển nhanh nổi cạnh màn hình */
        .floating-dock {
            position: absolute;
            display: flex;
            gap: 8px;
            z-index: 15;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .dock-portrait {
            right: -60px;
            top: 50%;
            transform: translateY(-50%);
            flex-direction: column;
        }

        .dock-landscape {
            bottom: -56px;
            left: 50%;
            transform: translateX(-50%);
            flex-direction: row;
        }

        .dock-btn {
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .dock-btn:hover {
            background: var(--bg-hover);
            transform: scale(1.08);
            border-color: #64748b;
        }

        .dock-btn:active {
            transform: scale(0.95);
        }

        /* Footer info tag */
        .meta-tag {
            position: absolute;
            bottom: 12px;
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(15, 23, 42, 0.6);
            padding: 4px 10px;
            border-radius: 6px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Sidebar công cụ hiện đại -->
    <aside id="sidebar">
        <!-- Brand & Status -->
        <div class="brand-header">
            <div class="brand-title">
                <div class="brand-icon">📱</div>
                <div class="brand-text">
                    <h1>Family Remote</h1>
                    <p>Hỗ Trợ Gia Đình Từ Xa</p>
                </div>
            </div>
            <div id="status-badge" class="status-chip status-offline">
                <span class="status-dot"></span>
                <span id="status-text">Đang chờ...</span>
            </div>
        </div>

        <!-- Nhóm 1: Điều Hướng Hệ Thống -->
        <div class="group-card">
            <div class="group-header">
                <span>Điều Hướng</span>
                <span style="font-size: 10px;">Navigation</span>
            </div>
            <div class="btn-grid-2">
                <button class="action-btn" onclick="sendAction('back')">◀ Quay lại (Back)</button>
                <button class="action-btn" onclick="sendAction('home')">● Trang chủ</button>
                <button class="action-btn" onclick="sendAction('recents')">■ Đa nhiệm</button>
                <button class="action-btn" onclick="sendAction('notifications')">▼ Thông báo</button>
            </div>
            <button class="action-btn" onclick="takeScreenshot()" style="width: 100%; border-color: #3b82f6;">
                📸 Chụp ảnh màn hình (Lưu về Laptop)
            </button>
        </div>

        <!-- Nhóm 2: Phím Cứng Vật Lý -->
        <div class="group-card">
            <div class="group-header">
                <span>Phím Cứng Thiết Bị</span>
                <span style="font-size: 10px;">Hardware</span>
            </div>
            <div class="btn-grid-3">
                <button class="action-btn" onclick="sendAction('volume_up')">🔊 Âm (+)</button>
                <button class="action-btn" onclick="sendAction('volume_down')">🔉 Âm (-)</button>
                <button class="action-btn" onclick="sendAction('mute')">🔇 Tắt tiếng</button>
            </div>
            <div class="btn-grid-2">
                <button class="action-btn btn-warning" onclick="sendAction('power')">⏻ Bật Menu Nguồn</button>
                <button class="action-btn" onclick="sendAction('lock')">🔒 Khóa màn hình</button>
            </div>
        </div>

        <!-- Nhóm 3: Mở Cài Đặt Hệ Thống Từ Xa -->
        <div class="group-card">
            <div class="group-header">
                <span>Cài Đặt Hệ Thống Từ Xa</span>
                <span style="font-size: 10px;">System Settings</span>
            </div>
            <div class="btn-grid-2">
                <button class="action-btn" onclick="sendAction('open_settings')">⚙️ Cài đặt máy</button>
                <button class="action-btn" onclick="sendAction('open_wifi')">📶 Mở Wi-Fi</button>
                <button class="action-btn" onclick="sendAction('open_accessibility')">♿ Quyền Trợ Năng</button>
                <button class="action-btn" onclick="sendAction('open_app_permissions')">🛡️ Quyền ứng dụng</button>
            </div>
        </div>

        <!-- Nhóm 4: Kết Nối Từ Xa & QR Code -->
        <div class="group-card">
            <div class="group-header">
                <span>Địa Chỉ Kết Nối Từ Xa (Internet / 4G)</span>
            </div>
            <div class="connect-box">
                <div id="ws-url-display" class="url-badge">Đang lấy URL...</div>
                <button class="action-btn btn-primary" onclick="copyWsUrl()">📋 Sao chép link gửi bố mẹ</button>
                <div class="qr-wrapper">
                    <img id="qr-code-img" alt="QR Code" src="" />
                </div>
            </div>
        </div>

        <!-- Nhóm 5: Kết thúc phiên -->
        <div style="margin-top: auto;">
            <button class="action-btn btn-danger" style="width: 100%; padding: 12px;" onclick="endRemoteSession()">
                ✕ DỪNG & TẮT PHIÊN TRÊN MÁY BỐ MẸ
            </button>
        </div>
    </aside>

    <!-- Khu vực hiển thị màn hình mô phỏng -->
    <main id="viewport">
        <div id="device-container" class="device-container orientation-portrait">
            <canvas id="phone-canvas" width="720" height="1560"></canvas>

            <!-- Floating Dock điều hướng nổi -->
            <div id="floating-dock" class="floating-dock dock-portrait">
                <button class="dock-btn" title="Quay lại" onclick="sendAction('back')">◀</button>
                <button class="dock-btn" title="Trang chủ" onclick="sendAction('home')">●</button>
                <button class="dock-btn" title="Đa nhiệm" onclick="sendAction('recents')">■</button>
                <button class="dock-btn" title="Tăng âm lượng" onclick="sendAction('volume_up')">＋</button>
                <button class="dock-btn" title="Giảm âm lượng" onclick="sendAction('volume_down')">－</button>
                <button class="dock-btn" title="Nguồn" onclick="sendAction('power')">⏻</button>
            </div>
        </div>

        <div id="meta-tag" class="meta-tag">Độ phân giải: 720 x 1560 (Dọc) | FPS: 0</div>
    </main>

    <script>
        const canvas = document.getElementById('phone-canvas');
        const ctx = canvas.getContext('2d');
        const deviceContainer = document.getElementById('device-container');
        const floatingDock = document.getElementById('floating-dock');
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const wsUrlDisplay = document.getElementById('ws-url-display');
        const qrCodeImg = document.getElementById('qr-code-img');
        const metaTag = document.getElementById('meta-tag');

        let ws = null;
        let reconnectTimeout = null;
        let img = new Image();
        let isPhoneConnected = false;
        let currentOrientation = "portrait";
        let frameCount = 0;
        let currentFps = 0;

        // Tính toán WebSocket URL chuẩn xác theo HTTPS / HTTP hiện tại
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        let currentWsUrl = `${protocol}//${window.location.host}/ws`;
        if (wsUrlDisplay) wsUrlDisplay.textContent = currentWsUrl;

        // Thường xuyên hỏi /api/info để lấy URL Cloudflare Tunnel mới nhất nếu có
        function fetchTunnelInfo() {
            fetch('/api/info')
                .then(r => r.json())
                .then(data => {
                    if (data.tunnel_url) {
                        const tunnelWss = data.tunnel_url.replace(/^https:\/\//, 'wss://') + '/ws';
                        currentWsUrl = tunnelWss;
                        if (wsUrlDisplay) wsUrlDisplay.textContent = tunnelWss;
                        if (qrCodeImg) {
                            qrCodeImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(tunnelWss)}`;
                        }
                    } else {
                        if (qrCodeImg) {
                            qrCodeImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(currentWsUrl)}`;
                        }
                    }
                })
                .catch(() => {});
        }
        fetchTunnelInfo();
        setInterval(fetchTunnelInfo, 3000);

        // Cập nhật FPS định kỳ
        setInterval(() => {
            currentFps = frameCount;
            frameCount = 0;
            updateMetaTag();
        }, 1000);

        function updateMetaTag() {
            const orientText = currentOrientation === 'landscape' ? 'Ngang' : 'Dọc';
            metaTag.textContent = `Độ phân giải: ${canvas.width} x ${canvas.height} (${orientText}) | FPS: ${currentFps}`;
        }

        function copyWsUrl() {
            navigator.clipboard.writeText(currentWsUrl).then(() => {
                alert("Đã sao chép địa chỉ WebSocket: " + currentWsUrl);
            }).catch(() => {
                prompt("Hãy sao chép địa chỉ bên dưới:", currentWsUrl);
            });
        }

        function drawPlaceholder(text = "Đang đợi hình ảnh máy bố mẹ...") {
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#64748b";
            ctx.font = "bold 20px -apple-system, BlinkMacSystemFont, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
        }
        drawPlaceholder();

        function setStatus(status) {
            statusBadge.className = 'status-chip';
            if (status === 'online') {
                statusBadge.classList.add('status-online');
                statusText.textContent = 'Đang kết nối';
                isPhoneConnected = true;
            } else if (status === 'connecting') {
                statusBadge.classList.add('status-connecting');
                statusText.textContent = 'Đang thử lại...';
                isPhoneConnected = false;
            } else {
                statusBadge.classList.add('status-offline');
                statusText.textContent = 'Chưa kết nối';
                isPhoneConnected = false;
            }
        }

        function applyOrientation(width, height, orientation) {
            const orient = orientation || (width > height ? 'landscape' : 'portrait');
            currentOrientation = orient;

            canvas.width = width;
            canvas.height = height;

            if (orient === 'landscape') {
                deviceContainer.className = 'device-container orientation-landscape';
                floatingDock.className = 'floating-dock dock-landscape';
                canvas.style.aspectRatio = `${width} / ${height}`;
                canvas.style.maxHeight = '75vh';
                canvas.style.maxWidth = '85vw';
            } else {
                deviceContainer.className = 'device-container orientation-portrait';
                floatingDock.className = 'floating-dock dock-portrait';
                canvas.style.aspectRatio = `${width} / ${height}`;
                canvas.style.maxHeight = '82vh';
                canvas.style.maxWidth = '80vw';
            }
            updateMetaTag();
        }

        function connectWebSocket() {
            if (reconnectTimeout) clearTimeout(reconnectTimeout);

            const wsHostUrl = `${protocol}//${window.location.host}/ws`;
            ws = new WebSocket(wsHostUrl);

            ws.onopen = () => {
                console.log('[WS] Đã kết nối Server điều khiển');
                ws.send(JSON.stringify({ type: 'register', role: 'web' }));
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === 'status') {
                        if (data.status === 'phone_connected') {
                            setStatus('online');
                            if (data.screenWidth && data.screenHeight) {
                                applyOrientation(data.screenWidth, data.screenHeight, data.orientation);
                            }
                        } else {
                            setStatus('offline');
                            drawPlaceholder("Bố mẹ đã ngắt kết nối");
                        }
                    } else if (data.type === 'screen_size') {
                        // Sự kiện tự động xoay màn hình
                        console.log('[Rotate Event]', data);
                        applyOrientation(data.width, data.height, data.orientation);
                    } else if (data.type === 'frame') {
                        if (!isPhoneConnected) setStatus('online');
                        frameCount++;

                        if (data.width && data.height && (canvas.width !== data.width || canvas.height !== data.height)) {
                            applyOrientation(data.width, data.height);
                        }

                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                        img.src = 'data:image/jpeg;base64,' + data.image;
                    }
                } catch (err) {
                    console.error('[WS Error]', err);
                }
            };

            ws.onclose = () => {
                setStatus('connecting');
                reconnectTimeout = setTimeout(connectWebSocket, 2000);
            };

            ws.onerror = (err) => {
                console.error('[WS Socket Error]', err);
                ws.close();
            };
        }

        connectWebSocket();

        // Xử lý sự kiện chuột / Gesture
        let startX = 0, startY = 0;
        let isMouseDown = false;
        let startTime = 0;

        function getNormalizedCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX ?? (e.touches && e.touches[0]?.clientX);
            const clientY = e.clientY ?? (e.touches && e.touches[0]?.clientY);

            const normX = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            const normY = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
            return { x: normX, y: normY };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; // Chỉ nhận chuột trái
            isMouseDown = true;
            startTime = Date.now();
            const pos = getNormalizedCoordinates(e);
            startX = pos.x;
            startY = pos.y;
        });

        window.addEventListener('mouseup', (e) => {
            if (!isMouseDown) return;
            isMouseDown = false;

            const pos = getNormalizedCoordinates(e);
            const endX = pos.x;
            const endY = pos.y;
            const elapsed = Date.now() - startTime;
            const dist = Math.hypot(endX - startX, endY - startY);

            if (dist < 0.015) {
                // Nhấp chuột -> Tap
                sendAction('tap', { x: startX, y: startY });
            } else {
                // Kéo chuột -> Swipe
                const duration = Math.min(600, Math.max(150, elapsed));
                sendAction('swipe', {
                    startX: startX,
                    startY: startY,
                    endX: endX,
                    endY: endY,
                    duration: duration
                });
            }
        });

        function sendAction(action, extra = {}) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: action, ...extra }));
            } else {
                console.warn('[Action] WebSocket chưa sẵn sàng để gửi', action);
            }
        }

        function takeScreenshot() {
            if (!isPhoneConnected) {
                alert("Vui lòng đợi kết nối với máy bố mẹ trước khi chụp ảnh màn hình!");
                return;
            }
            const dataUrl = canvas.toDataURL("image/png");
            const a = document.createElement("a");
            const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
            a.href = dataUrl;
            a.download = `FamilyRemote-Screenshot-${timestamp}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function endRemoteSession() {
            if (confirm("Bạn có chắc chắn muốn ngắt kết nối và đóng phiên hỗ trợ trên máy bố mẹ?")) {
                sendAction('disconnect');
                setStatus('offline');
                drawPlaceholder("Đã ngắt kết nối từ xa");
            }
        }
    </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient (Deep Elegant Navy & Indigo) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312E81;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E1B4B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>

    <!-- Vibrant Big Heart Gradient (Ruby Rose to Sunset Coral) -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF2E63;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#E11D48;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BE123C;stop-opacity:1" />
    </linearGradient>

    <!-- Heart Top Specular Highlight Gradient -->
    <linearGradient id="heartGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.45" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>

    <!-- Outer Soft Glow for Heart -->
    <filter id="heartGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#FF2E63" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#BE123C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Modern Squircle Base -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Border Rim -->
  <rect x="6" y="6" width="500" height="500" rx="118" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="3"/>

  <!-- BIG GLOWING CARE HEART -->
  <g filter="url(#heartGlow)">
    <!-- Base Heart Shape -->
    <path d="M 256 160
             C 256 142 232 108 190 108
             C 140 108 100 152 100 206
             C 100 286 182 356 256 406
             C 330 356 412 286 412 206
             C 412 152 372 108 322 108
             C 280 108 256 142 256 160 Z"
          fill="url(#heartGrad)"/>

    <!-- Subtle Gloss Reflection on Left Lobe -->
    <path d="M 256 166
             C 256 150 236 122 196 122
             C 156 122 120 158 120 202
             C 120 232 144 268 180 300
             C 160 270 144 238 144 210
             C 144 172 170 144 200 144
             C 224 144 246 156 256 166 Z"
          fill="url(#heartGloss)"/>
  </g>
</svg>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỗ Trợ Màn Hình Bố Mẹ Từ Xa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Sidebar công cụ bên trái */
        #toolbar {
            width: 320px;
            background: #1e293b;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            border-right: 1px solid #334155;
            box-shadow: 4px 0 16px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .header h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .status-online { background: #065f46; color: #34d399; }
        .status-offline { background: #881337; color: #fda4af; }
        .status-connecting { background: #854d0e; color: #fde047; }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        button:hover {
            background: #475569;
            border-color: #64748b;
        }
        button:active {
            transform: scale(0.97);
        }

        /* Nút Nguồn và Ngắt kết nối */
        .btn-power {
            background: #b91c1c;
            border-color: #dc2626;
            grid-column: span 2;
        }
        .btn-power:hover { background: #dc2626; }

        .btn-disconnect {
            background: #475569;
            border-color: #64748b;
            color: #fca5a5;
            width: 100%;
            margin-top: 10px;
        }
        .btn-disconnect:hover {
            background: #991b1b;
            color: #ffffff;
            border-color: #ef4444;
        }

        .btn-volume {
            background: #1e3a8a;
            border-color: #2563eb;
        }
        .btn-volume:hover { background: #2563eb; }

        .guide-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.6;
            color: #94a3b8;
        }

        /* Khung hiển thị kết nối & QR Code */
        .connect-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .connect-box .url-text {
            word-break: break-all;
            background: #1e293b;
            padding: 6px 8px;
            border-radius: 6px;
            font-family: monospace;
            color: #38bdf8;
            font-size: 11px;
            user-select: all;
        }

        .qr-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            padding: 8px;
            border-radius: 8px;
            margin-top: 4px;
        }

        .qr-container img {
            width: 140px;
            height: 140px;
            display: block;
        }

        /* Khung hiển thị màn hình mô phỏng Emulator */
        #viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090d16;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .phone-frame {
            position: relative;
            background: #1e293b;
            padding: 12px;
            border-radius: 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 4px #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            max-height: 90vh;
        }

        /* Nút vật lý mô phỏng bên cạnh viền máy */
        .emulator-controls-right {
            position: absolute;
            right: -56px;
            top: 100px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .side-btn {
            background: #334155;
            border: 1px solid #475569;
            color: #e2e8f0;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            padding: 0;
            font-size: 18px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        .side-btn:hover { background: #475569; }

        #phone-canvas {
            display: block;
            border-radius: 24px;
            cursor: crosshair;
            background: #000;
            max-height: 84vh;
            max-width: 80vw;
            width: auto;
            height: 84vh;
            aspect-ratio: 9 / 19.5;
            object-fit: contain;
            touch-action: none;
        }

        .resolution-tag {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #64748b;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- Bảng điều khiển Emulator -->
    <div id="toolbar">
        <div class="header">
            <h2>Hỗ Trợ Bố Mẹ</h2>
            <span id="status-badge" class="status-badge status-offline">● Đang chờ bố mẹ bật...</span>
        </div>

        <div>
            <div class="section-title">Phím ảo Android</div>
            <div class="btn-grid">
                <button onclick="sendAction('back')">◀ Quay lại (Back)</button>
                <button onclick="sendAction('home')">● Màn hình chính</button>
                <button onclick="sendAction('recents')">■ Đa nhiệm</button>
                <button onclick="sendAction('notifications')">▼ Thông báo</button>
            </div>
        </div>

        <div>
            <div class="section-title">Phím cứng thiết bị</div>
            <div class="btn-grid">
                <button class="btn-volume" onclick="sendAction('volume_up')">🔊 Tăng âm (+)</button>
                <button class="btn-volume" onclick="sendAction('volume_down')">🔉 Giảm âm (-)</button>
                <button class="btn-power" onclick="sendAction('power')">⏻ Bật Menu Nguồn</button>
                <button onclick="sendAction('lock')">🔒 Khóa màn hình</button>
            </div>
        </div>

        <div>
            <div class="section-title">Kết nối từ xa (Internet / 4G)</div>
            <div class="connect-box">
                <div>Địa chỉ máy chủ (WS / WSS):</div>
                <div id="ws-url-display" class="url-text">Đang lấy URL...</div>
                <button style="padding: 6px 10px; font-size: 11px;" onclick="copyWsUrl()">📋 Sao chép link cho bố mẹ</button>
                <div class="qr-container">
                    <img id="qr-code-img" alt="QR Code kết nối" src="" />
                </div>
            </div>
        </div>

        <div style="margin-top: auto;">
            <div class="guide-box">
                🖱️ <strong>Chuột trái:</strong> Chạm (Tap)<br>
                ↔️ <strong>Kéo chuột:</strong> Vuốt lướt màn hình (Swipe)<br>
                🎯 <strong>Tọa độ:</strong> Chuẩn xác theo tỉ lệ thực
            </div>
            <button class="btn-disconnect" onclick="endRemoteSession()">
                ✕ DỪNG & TẮT PHIÊN TRÊN MÁY BỐ MẸ
            </button>
        </div>
    </div>

    <!-- Màn hình điện thoại -->
    <div id="viewport">
        <div class="phone-frame">
            <canvas id="phone-canvas" width="720" height="1560"></canvas>
            <div id="resolution-tag" class="resolution-tag">Độ phân giải: Đang chờ...</div>
            
            <!-- Cụm phím nhanh kiểu Android Studio Emulator -->
            <div class="emulator-controls-right">
                <button class="side-btn" title="Nguồn" onclick="sendAction('power')">⏻</button>
                <button class="side-btn" title="Tăng âm lượng" onclick="sendAction('volume_up')">＋</button>
                <button class="side-btn" title="Giảm âm lượng" onclick="sendAction('volume_down')">－</button>
                <button class="side-btn" title="Quay lại" onclick="sendAction('back')">◀</button>
                <button class="side-btn" title="Home" onclick="sendAction('home')">●</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('phone-canvas');
        const ctx = canvas.getContext('2d');
        const badge = document.getElementById('status-badge');
        const resolutionTag = document.getElementById('resolution-tag');
        const wsUrlDisplay = document.getElementById('ws-url-display');
        const qrCodeImg = document.getElementById('qr-code-img');
        
        let ws = null;
        let reconnectTimeout = null;
        let img = new Image();
        let isPhoneConnected = false;

        // Tính toán WebSocket URL chuẩn xác theo HTTPS / HTTP hiện tại
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const currentWsUrl = `${protocol}//${window.location.host}`;
        if (wsUrlDisplay) wsUrlDisplay.textContent = currentWsUrl;
        if (qrCodeImg) {
            qrCodeImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(currentWsUrl)}`;
        }

        function copyWsUrl() {
            navigator.clipboard.writeText(currentWsUrl).then(() => {
                alert("Đã sao chép địa chỉ WebSocket: " + currentWsUrl);
            }).catch(() => {
                prompt("Hãy sao chép địa chỉ bên dưới:", currentWsUrl);
            });
        }

        // Vẽ màn hình chờ ban đầu
        function drawPlaceholder(text = "Đang đợi hình ảnh máy bố mẹ...") {
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#64748b";
            ctx.font = "bold 24px -apple-system, BlinkMacSystemFont, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
        }
        drawPlaceholder();

        function connectWebSocket() {
            if (reconnectTimeout) clearTimeout(reconnectTimeout);

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                console.log('[WS] Đã kết nối Server điều khiển');
                ws.send(JSON.stringify({ type: 'register', role: 'web' }));
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'status') {
                        if (data.status === 'phone_connected') {
                            isPhoneConnected = true;
                            badge.className = 'status-badge status-online';
                            badge.textContent = '● Đang kết nối máy bố mẹ';
                            if (data.screenWidth && data.screenHeight) {
                                updateCanvasResolution(data.screenWidth, data.screenHeight);
                            }
                        } else {
                            isPhoneConnected = false;
                            badge.className = 'status-badge status-offline';
                            badge.textContent = '● Bố mẹ đã tắt kết nối';
                            drawPlaceholder("Bố mẹ đã ngắt kết nối");
                        }
                    } else if (data.type === 'frame') {
                        if (!isPhoneConnected) {
                            isPhoneConnected = true;
                            badge.className = 'status-badge status-online';
                            badge.textContent = '● Đang kết nối máy bố mẹ';
                        }
                        if (data.width && data.height && (canvas.width !== data.width || canvas.height !== data.height)) {
                            updateCanvasResolution(data.width, data.height);
                        }
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                        img.src = 'data:image/jpeg;base64,' + data.image;
                    }
                } catch (err) {
                    console.error('[WS] Lỗi parse frame:', err);
                }
            };

            ws.onclose = () => {
                badge.className = 'status-badge status-connecting';
                badge.textContent = '○ Mất kết nối tới máy chủ, đang thử lại...';
                isPhoneConnected = false;
                reconnectTimeout = setTimeout(connectWebSocket, 2000);
            };

            ws.onerror = (err) => {
                console.error('[WS Error]', err);
                ws.close();
            };
        }

        function updateCanvasResolution(w, h) {
            canvas.width = w;
            canvas.height = h;
            canvas.style.aspectRatio = `${w} / ${h}`;
            resolutionTag.textContent = `Độ phân giải hiển thị: ${w} x ${h}`;
        }

        connectWebSocket();

        // Xử lý sự kiện chuột / cử chỉ vuốt
        let startX = 0, startY = 0;
        let isMouseDown = false;
        let startTime = 0;

        function getNormalizedCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX ?? (e.touches && e.touches[0]?.clientX);
            const clientY = e.clientY ?? (e.touches && e.touches[0]?.clientY);
            
            const normX = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            const normY = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
            return { x: normX, y: normY };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; // Chỉ nhận chuột trái
            isMouseDown = true;
            startTime = Date.now();
            const pos = getNormalizedCoordinates(e);
            startX = pos.x;
            startY = pos.y;
        });

        window.addEventListener('mouseup', (e) => {
            if (!isMouseDown) return;
            isMouseDown = false;
            
            const pos = getNormalizedCoordinates(e);
            const endX = pos.x;
            const endY = pos.y;
            const elapsed = Date.now() - startTime;
            const dist = Math.hypot(endX - startX, endY - startY);

            if (dist < 0.015) {
                // Nhấp chuột tại chỗ -> Chạm (Tap)
                sendAction('tap', { x: startX, y: startY });
            } else {
                // Kéo chuột -> Vuốt (Swipe)
                const duration = Math.min(600, Math.max(150, elapsed));
                sendAction('swipe', {
                    startX: startX,
                    startY: startY,
                    endX: endX,
                    endY: endY,
                    duration: duration
                });
            }
        });

        function sendAction(action, extra = {}) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: action, ...extra }));
            } else {
                console.warn('[Action] WebSocket chưa sẵn sàng để gửi', action);
            }
        }

        function endRemoteSession() {
            if (confirm("Bạn có chắc chắn muốn ngắt kết nối và đóng app trên máy bố mẹ?")) {
                sendAction('disconnect');
                badge.className = 'status-badge status-offline';
                badge.textContent = '● Đã yêu cầu ngắt kết nối';
            }
        }
    </script>
</body>
</html>
